name: Validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beastgames
          POSTGRES_PASSWORD: beastgames_local
          POSTGRES_DB: beastgames_local
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U beastgames" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://beastgames:beastgames_local@localhost:5433/beastgames_local
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run db:generate && npm run db:deploy && npm run db:seed:test
      - run: npm run typecheck && npm test
      - run: npm run build:backend && npm run build:salp
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: |
          npm start > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health && break; sleep 1; done
          npm run test:performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-artifacts
          path: |
            artifacts/
            playwright-report/
            test-results/
