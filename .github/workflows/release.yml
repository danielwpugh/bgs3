name: Build release artifacts
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci && npm run db:generate && npm run typecheck && npm test
      - run: node scripts/build-salp.mjs "$BUILD_ENV" && node scripts/verify-salp.mjs "$BUILD_ENV"
        env:
          BUILD_ENV: ${{ inputs.environment }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          SALP_PAGE_ID: ${{ vars.SALP_PAGE_ID || 'beastgames-s3contestants' }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: salp-${{ inputs.environment }}-${{ github.sha }}
          path: artifacts/${{ inputs.environment }}/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/backend:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
