services:
  db:
    image: postgres:16-alpine
    ports: ["127.0.0.1:5433:5432"]
    environment:
      POSTGRES_USER: beastgames
      POSTGRES_PASSWORD: beastgames_local
      POSTGRES_DB: beastgames_local
    volumes: ["beastgames-local:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beastgames -d beastgames_local"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  beastgames-local:
