services:
  api:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable image tag}
    restart: unless-stopped
    env_file: /opt/beastgames/backend.env
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["/opt/beastgames/uploads:/app/uploads"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
